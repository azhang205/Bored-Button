```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>I'm Bored</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

body{
    background:#fff;
    transition:background 1.2s ease;
}

/* =========================
   START SCREEN
========================= */

#start{
    position:fixed;
    inset:0;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
}

#bored{
    width:210px;
    height:210px;
    border-radius:50%;
    border:0;
    background:#e53935;
    color:white;
    font-size:27px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 12px 30px rgba(0,0,0,.16);
    transition:.15s;
}

#bored:hover{
    transform:scale(1.06);
    box-shadow:0 16px 38px rgba(0,0,0,.2);
}

#bored:active{
    transform:scale(.94);
}

/* =========================
   MAIN WORLD
========================= */

#world{
    position:fixed;
    inset:0;
    display:none;
}

#message{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:0 2px 8px rgba(0,0,0,.35);
    z-index:30;
    text-align:center;
}

#again{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    border:0;
    border-radius:30px;
    padding:13px 25px;
    background:rgba(255,255,255,.85);
    color:#333;
    font-weight:bold;
    cursor:pointer;
    backdrop-filter:blur(8px);
}

#counter{
    position:absolute;
    bottom:25px;
    right:25px;
    z-index:100;
    color:white;
    text-shadow:0 2px 5px #000;
}

/* =========================
   SKY
========================= */

#sky{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:linear-gradient(#75c9ff,#c8edff);
    transition:1.5s;
}

.sun{
    position:absolute;
    width:110px;
    height:110px;
    border-radius:50%;
    background:#fff3a0;
    box-shadow:0 0 70px #fff3a0;
    top:11%;
    right:12%;
}

.moon{
    position:absolute;
    width:85px;
    height:85px;
    border-radius:50%;
    background:#f4f4f4;
    box-shadow:0 0 40px white;
    top:12%;
    right:15%;
    display:none;
}

.cloud{
    position:absolute;
    width:190px;
    height:55px;
    background:white;
    border-radius:50px;
    opacity:.75;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:80px;
    height:80px;
    left:25px;
    bottom:10px;
}

.cloud:after{
    width:95px;
    height:95px;
    right:25px;
    bottom:3px;
}

.c1{
    top:20%;
    left:-250px;
    animation:cloudmove 70s linear infinite;
}

.c2{
    top:36%;
    left:-300px;
    transform:scale(.65);
    animation:cloudmove 100s linear infinite;
}

@keyframes cloudmove{
    to{left:110%}
}

#ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:25%;
    background:#72bd67;
}

/* =========================
   STARS
========================= */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.25}
    to{opacity:1}
}

/* =========================
   HALLWAY
========================= */

#hallway{
    position:absolute;
    inset:0;
    display:none;
    overflow:hidden;
    background:#18171b;
}

/* ceiling */

.hall-ceiling{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:38%;
    background:
        linear-gradient(
            90deg,
            #242229,
            #35323b 50%,
            #242229
        );
    clip-path:polygon(0 0,100% 0,72% 100%,28% 100%);
}

/* left/right walls */

.hall-left,
.hall-right{
    position:absolute;
    top:0;
    width:50%;
    height:100%;
}

.hall-left{
    left:0;
    background:linear-gradient(
        90deg,
        #25232a,
        #4b4650
    );
    clip-path:polygon(0 0,100% 0,50% 100%,0 100%);
}

.hall-right{
    right:0;
    background:linear-gradient(
        90deg,
        #4b4650,
        #25232a
    );
    clip-path:polygon(0 0,100% 0,100% 100%,50% 100%);
}

/* floor */

.hall-floor{
    position:absolute;
    bottom:0;
    width:100%;
    height:48%;
    background:
        repeating-linear-gradient(
            90deg,
            #29272d 0,
            #29272d 95px,
            #333038 96px,
            #333038 100px
        );
    clip-path:polygon(
        0 100%,
        100% 100%,
        70% 0,
        30% 0
    );
}

/* floor center reflection */

.hall-floor:after{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:2px;
    height:100%;
    background:rgba(255,255,255,.12);
}

/* ceiling lights */

.light{
    position:absolute;
    width:90px;
    height:16px;
    background:#fff8cf;
    box-shadow:
        0 0 25px #fff1a1,
        0 0 70px rgba(255,240,150,.4);
    transform:translateX(-50%);
}

.l1{left:50%;top:14%}
.l2{left:42%;top:30%;transform:scale(.75) translateX(-50%)}
.l3{left:58%;top:30%;transform:scale(.75) translateX(-50%)}

/* =========================
   ACTUAL DOORS
========================= */

.door{
    position:absolute;
    width:120px;
    height:215px;
    background:linear-gradient(
        90deg,
        #392f39,
        #594553,
        #302832
    );
    border:7px solid #201c22;
    box-shadow:
        0 15px 25px rgba(0,0,0,.45),
        inset 0 0 20px rgba(0,0,0,.35);
    cursor:pointer;
    transition:.2s;
}

.door:hover{
    filter:brightness(1.3);
    transform:translateY(-4px);
}

/* panels */

.door:before{
    content:"";
    position:absolute;
    left:16px;
    right:16px;
    top:18px;
    bottom:18px;
    border:3px solid rgba(255,255,255,.1);
    box-shadow:
        inset 0 0 0 3px rgba(0,0,0,.2);
}

/* handle */

.door:after{
    content:"";
    position:absolute;
    right:14px;
    top:52%;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#d5bd7b;
    box-shadow:0 0 5px #d5bd7b;
}

/* left doors */

.door-left-1{
    left:17%;
    top:35%;
    transform:perspective(500px) rotateY(15deg);
}

.door-left-2{
    left:5%;
    top:26%;
    transform:
        scale(.72)
        perspective(500px)
        rotateY(22deg);
}

/* right doors */

.door-right-1{
    right:17%;
    top:35%;
    transform:perspective(500px) rotateY(-15deg);
}

.door-right-2{
    right:5%;
    top:26%;
    transform:
        scale(.72)
        perspective(500px)
        rotateY(-22deg);
}

.door-label{
    position:absolute;
    bottom:-35px;
    left:50%;
    transform:translateX(-50%);
    white-space:nowrap;
    color:#ddd;
    font-size:13px;
}

/* end of hallway */

.hall-end{
    position:absolute;
    left:50%;
    top:36%;
    transform:translateX(-50%);
    width:130px;
    height:205px;
    background:#17151a;
    border:8px solid #29242c;
    box-shadow:0 0 40px rgba(0,0,0,.8);
}

.end-light{
    position:absolute;
    left:50%;
    top:32%;
    transform:translateX(-50%);
    width:45px;
    height:90px;
    background:#fff6bd;
    box-shadow:0 0 70px #fff1a0;
}

/* =========================
   OTHER WORLDS
========================= */

.world-scene{
    position:absolute;
    inset:0;
    display:none;
}

/* ocean */

#ocean{
    background:
        linear-gradient(#8edbff 0%,#d7f5ff 42%,#0879a8 43%,#034e70 100%);
}

.ocean-wave{
    position:absolute;
    width:130%;
    height:90px;
    left:-15%;
    border-radius:50%;
    border-top:4px solid rgba(255,255,255,.65);
    animation:wave 4s linear infinite;
}

.w1{top:55%}
.w2{top:67%;animation-delay:-2s}
.w3{top:80%;animation-delay:-1s}

@keyframes wave{
    from{transform:translateX(-5%)}
    to{transform:translateX(5%)}
}

/* forest */

#forest{
    background:linear-gradient(#8bcff0 0%,#d7f1d0 48%,#467b3f 49%,#183d1b);
}

.tree{
    position:absolute;
    bottom:22%;
    width:0;
    height:0;
    border-left:70px solid transparent;
    border-right:70px solid transparent;
    border-bottom:180px solid #214f27;
}

.tree:after{
    content:"";
    position:absolute;
    left:-8px;
    top:165px;
    width:16px;
    height:70px;
    background:#513b28;
}

/* space */

#space{
    background:
        radial-gradient(circle at center,#18245c,#070a19 65%,#02030b);
}

.planet{
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:linear-gradient(135deg,#c87554,#6d3049);
    box-shadow:0 0 70px rgba(180,100,120,.4);
    left:15%;
    top:28%;
}

.space-star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;
}

/* city */

#city{
    background:
        linear-gradient(#17243e 0%,#30476b 55%,#111 56%);
}

.building{
    position:absolute;
    bottom:0;
    width:90px;
    background:#17191e;
}

.window{
    width:8px;
    height:8px;
    background:#f5d878;
    position:absolute;
}

/* weird world */

#weird{
    background:
        conic-gradient(
            from 90deg,
            #ff004c,
            #7c00ff,
            #00d9ff,
            #00ff6a,
            #ffff00,
            #ff004c
        );
    animation:weirdspin 10s linear infinite;
}

@keyframes weirdspin{
    to{filter:hue-rotate(360deg)}
}

.weird-text{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:70px;
    font-weight:bold;
    text-shadow:0 0 20px #000;
}

/* =========================
   SECRET EVENTS
========================= */

#event{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:200;
    background:rgba(0,0,0,.15);
    pointer-events:none;
}

#eventText{
    font-size:60px;
    color:white;
    font-weight:bold;
    text-shadow:0 5px 20px #000;
    animation:event .8s ease;
}

@keyframes event{
    from{transform:scale(.1) rotate(-20deg);opacity:0}
    50%{transform:scale(1.2);opacity:1}
    to{transform:scale(1);opacity:1}
}

@media(max-width:700px){
    .door{
        width:80px;
        height:150px;
    }

    #bored{
        width:180px;
        height:180px;
    }
}
</style>
</head>

<body>

<!-- ==================================
     START
================================== -->

<div id="start">
    <button id="bored">I'M BORED</button>
</div>


<!-- ==================================
     WORLD
================================== -->

<div id="world">

    <div id="message"></div>

    <!-- SKY -->

    <div id="sky" class="world-scene">
        <div class="sun"></div>
        <div class="moon"></div>
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div id="skyStars"></div>
        <div id="ground"></div>
    </div>


    <!-- HALLWAY -->

    <div id="hallway" class="world-scene">

        <div class="hall-ceiling"></div>

        <div class="hall-left"></div>
        <div class="hall-right"></div>

        <div class="hall-floor"></div>

        <div class="light l1"></div>
        <div class="light l2"></div>
        <div class="light l3"></div>

        <div class="hall-end"></div>
        <div class="end-light"></div>

        <div class="door door-left-1"
             onclick="door(1)">
            <span class="door-label">103</span>
        </div>

        <div class="door door-left-2"
             onclick="door(2)">
            <span class="door-label">???</span>
        </div>

        <div class="door door-right-1"
             onclick="door(3)">
            <span class="door-label">204</span>
        </div>

        <div class="door door-right-2"
             onclick="door(4)">
            <span class="door-label">∞</span>
        </div>

    </div>


    <!-- OCEAN -->

    <div id="ocean" class="world-scene">
        <div class="ocean-wave w1"></div>
        <div class="ocean-wave w2"></div>
        <div class="ocean-wave w3"></div>
    </div>


    <!-- FOREST -->

    <div id="forest" class="world-scene">

        <div class="tree" style="left:10%"></div>
        <div class="tree" style="left:28%;transform:scale(.75)"></div>
        <div class="tree" style="left:48%;transform:scale(1.2)"></div>
        <div class="tree" style="left:70%;transform:scale(.8)"></div>
        <div class="tree" style="left:87%;transform:scale(.65)"></div>

    </div>


    <!-- SPACE -->

    <div id="space" class="world-scene">

        <div class="planet"></div>

        <div id="spaceStars"></div>

    </div>


    <!-- CITY -->

    <div id="city" class="world-scene"></div>


    <!-- WEIRD -->

    <div id="weird" class="world-scene">
        <div class="weird-text">WHY?</div>
    </div>


    <!-- EVENT -->

    <div id="event">
        <div id="eventText"></div>
    </div>


    <div id="counter"></div>

    <button id="again">I'M BORED AGAIN</button>

</div>


<script>

/* ==================================
   VARIABLES
================================== */

let clicks = 0;

const start = document.getElementById("start");
const world = document.getElementById("world");
const message = document.getElementById("message");
const counter = document.getElementById("counter");

const scenes = document.querySelectorAll(".world-scene");


/* ==================================
   START
================================== */

document.getElementById("bored").onclick = () => {

    start.style.display = "none";
    world.style.display = "block";

    bored();

};


/* ==================================
   MAIN RANDOMIZER
================================== */

document.getElementById("again").onclick = bored;

function bored(){

    clicks++;

    counter.textContent =
        "Clicks: " + clicks;

    scenes.forEach(s =>
        s.style.display = "none"
    );

    let choice =
        Math.floor(Math.random()*9);

    if(choice === 0) sky();
    if(choice === 1) hallway();
    if(choice === 2) ocean();
    if(choice === 3) forest();
    if(choice === 4) space();
    if(choice === 5) city();
    if(choice === 6) weird();
    if(choice === 7) surprise();
    if(choice === 8) sky(true);

}


/* ==================================
   SKY
================================== */

function sky(night=false){

    const s =
        document.getElementById("sky");

    s.style.display = "block";

    const sun =
        document.querySelector(".sun");

    const moon =
        document.querySelector(".moon");

    if(night){

        s.style.background =
            "linear-gradient(#08102e,#182d59,#40516b)";

        sun.style.display="none";
        moon.style.display="block";

        makeStars(
            document.getElementById("skyStars"),
            100
        );

        message.textContent =
            "The world is asleep.";

    }else{

        s.style.background =
            "linear-gradient(#72c8ff,#d9f4ff)";

        sun.style.display="block";
        moon.style.display="none";

        message.textContent =
            "Nothing is wrong with this sky.";

    }

}


/* ==================================
   HALLWAY
================================== */

function hallway(){

    document.getElementById("hallway")
        .style.display="block";

    message.textContent =
        "Which door?";
}


/* ==================================
   DOORS
================================== */

function door(number){

    if(number === 1){
        forest();
        message.textContent =
            "Door 103 leads to a forest.";
    }

    else if(number === 2){
        space();
        message.textContent =
            "You opened the wrong door.";
    }

    else if(number === 3){
        ocean();
        message.textContent =
            "There is water behind this door.";
    }

    else{
        hallway();

        message.textContent =
            "The hallway continues.";

        /* subtly regenerate the door labels */

        document.querySelectorAll(".door-label")
            .forEach(x=>{
                x.textContent =
                    Math.floor(Math.random()*999);
            });
    }

}


/* ==================================
   OCEAN
================================== */

function ocean(){

    document.getElementById("ocean")
        .style.display="block";

    message.textContent =
        "You are standing above an ocean.";

}


/* ==================================
   FOREST
================================== */

function forest(){

    document.getElementById("forest")
        .style.display="block";

    message.textContent =
        "There wasn't a forest here before.";

}


/* ==================================
   SPACE
================================== */

function space(){

    document.getElementById("space")
        .style.display="block";

    makeStars(
        document.getElementById("spaceStars"),
        150
    );

    message.textContent =
        "You are no longer on Earth.";

}


/* ==================================
   CITY
================================== */

function city(){

    const c =
        document.getElementById("city");

    c.style.display="block";

    c.innerHTML="";

    for(let i=0;i<14;i++){

        let b =
            document.createElement("div");

        b.className="building";

        b.style.height =
            (120+Math.random()*400)+"px";

        b.style.left =
            (i*8)+"%";

        for(let j=0;j<12;j++){

            let w =
                document.createElement("div");

            w.className="window";

            w.style.left =
                (10+Math.random()*70)+"%";

            w.style.top =
                (10+j*25)+"px";

            b.appendChild(w);

        }

        c.appendChild(b);

    }

    message.textContent =
        "An empty city.";
}


/* ==================================
   WEIRD
================================== */

function weird(){

    document.getElementById("weird")
        .style.display="block";

    message.textContent =
        "Something went wrong.";

}


/* ==================================
   STARS
================================== */

function makeStars(container,count){

    container.innerHTML="";

    for(let i=0;i<count;i++){

        let star =
            document.createElement("div");

        star.className =
            container.id === "spaceStars"
            ? "space-star"
            : "star";

        star.style.left =
            Math.random()*100+"%";

        star.style.top =
            Math.random()*80+"%";

        if(container.id === "spaceStars"){

            star.style.opacity =
                Math.random();

        }

        container.appendChild(star);

    }

}


/* ==================================
   RANDOM SURPRISES
================================== */

function surprise(){

    const event =
        document.getElementById("event");

    const text =
        document.getElementById("eventText");

    const things = [

        "🐟",
        "404",
        "HELLO",
        "RUN",
        "???",
        "🌙",
        "🛸",
        "BOOM",
        "YOU FOUND NOTHING",
        "NICE",
        "WHY ARE YOU HERE?",
        "∞",
        "🦆",
        "THE DUCK KNOWS"

    ];

    text.textContent =
        things[
            Math.floor(Math.random()*things.length)
        ];

    event.style.display="flex";

    setTimeout(()=>{
        event.style.display="none";
    },1400);

}


/* ==================================
   RARE EVENTS
================================== */

setInterval(()=>{

    if(clicks >= 5 && Math.random()<.05){

        document.body.animate(
            [
                {transform:"translateX(0)"},
                {transform:"translateX(8px)"},
                {transform:"translateX(-8px)"},
                {transform:"translateX(0)"}
            ],
            {duration:400}
        );

    }

},3000);

</script>

</body>
</html>

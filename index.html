<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>I'm Bored</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,sans-serif;background:#fff}

/* =========================================================
   START
========================================================= */

#start{
    position:fixed;
    inset:0;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

#startButton{
    width:210px;
    height:210px;
    border:0;
    border-radius:50%;
    background:#e53935;
    color:white;
    font-size:27px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 12px 30px rgba(0,0,0,.15);
    transition:transform .15s,box-shadow .15s;
}

#startButton:hover{
    transform:scale(1.05);
    box-shadow:0 17px 38px rgba(0,0,0,.2);
}

#startButton:active{
    transform:scale(.94);
}


/* =========================================================
   COMMON
========================================================= */

#world{
    display:none;
    position:fixed;
    inset:0;
}

.scene{
    position:absolute;
    inset:0;
    display:none;
}

#message{
    position:absolute;
    z-index:500;
    top:24px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 18px;
    border-radius:20px;
    color:white;
    background:rgba(0,0,0,.22);
    backdrop-filter:blur(8px);
    font-size:18px;
    text-shadow:0 1px 3px #000;
    white-space:nowrap;
}

#again{
    position:absolute;
    z-index:600;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    border:0;
    border-radius:25px;
    padding:13px 25px;
    background:rgba(255,255,255,.9);
    color:#222;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

#counter{
    position:absolute;
    z-index:600;
    right:20px;
    bottom:20px;
    color:white;
    text-shadow:0 2px 5px #000;
}


/* =========================================================
   1. LIVING SKY
========================================================= */

#sky{
    background:linear-gradient(#72c8ff 0%,#d8f4ff 72%,#91cf72 72%);
}

.sun{
    position:absolute;
    width:115px;
    height:115px;
    right:12%;
    top:11%;
    border-radius:50%;
    background:#ffe982;
    box-shadow:0 0 70px #ffe982;
}

.cloud{
    position:absolute;
    width:180px;
    height:48px;
    border-radius:50px;
    background:white;
    opacity:.8;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:75px;
    height:75px;
    left:25px;
    bottom:5px;
}

.cloud:after{
    width:90px;
    height:90px;
    right:20px;
    bottom:0;
}

.skyCloud1{
    top:20%;
    left:-250px;
    animation:cloudMove 65s linear infinite;
}

.skyCloud2{
    top:38%;
    left:-300px;
    transform:scale(.7);
    animation:cloudMove 90s linear infinite;
}

@keyframes cloudMove{
    to{left:110%}
}

.skyGrass{
    position:absolute;
    bottom:0;
    width:100%;
    height:28%;
    background:
        repeating-linear-gradient(
            105deg,
            #72b95e 0,
            #72b95e 5px,
            #68ae55 6px,
            #68ae55 9px
        );
}

.skyFlower{
    position:absolute;
    bottom:22%;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#fff;
}


/* =========================================================
   2. NIGHT SKY
========================================================= */

#night{
    background:linear-gradient(#05091e,#101d42 65%,#1a2c3d);
}

.moon{
    position:absolute;
    width:100px;
    height:100px;
    right:13%;
    top:12%;
    border-radius:50%;
    background:#f2f2e8;
    box-shadow:0 0 45px rgba(255,255,230,.5);
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2}
    to{opacity:1}
}


/* =========================================================
   3. INFINITE HALLWAY
========================================================= */

#hallway{
    background:#141318;
}

/* ceiling */

.hCeiling{
    position:absolute;
    inset:0 0 auto;
    height:42%;
    background:
        linear-gradient(
            90deg,
            #19181d 0%,
            #3c3941 50%,
            #19181d 100%
        );
    clip-path:polygon(0 0,100% 0,69% 100%,31% 100%);
}

/* left wall */

.hLeft{
    position:absolute;
    inset:0 auto 0 0;
    width:50%;
    background:
        linear-gradient(
            90deg,
            #19181d,
            #514d54
        );
    clip-path:polygon(0 0,100% 0,50% 100%,0 100%);
}

/* right wall */

.hRight{
    position:absolute;
    inset:0 0 0 auto;
    width:50%;
    background:
        linear-gradient(
            90deg,
            #514d54,
            #19181d
        );
    clip-path:polygon(0 0,100% 0,100% 100%,50% 100%);
}

/* floor */

.hFloor{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:53%;
    background:
        repeating-linear-gradient(
            90deg,
            #242228 0,
            #242228 85px,
            #302e35 86px,
            #302e35 90px
        );
    clip-path:polygon(
        29% 0,
        71% 0,
        100% 100%,
        0 100%
    );
}

/* center vanishing glow */

.horizonGlow{
    position:absolute;
    left:50%;
    top:37%;
    width:170px;
    height:210px;
    transform:translate(-50%,-50%);
    background:radial-gradient(
        ellipse,
        rgba(255,236,163,.22),
        transparent 70%
    );
}

/* ceiling lights */

.ceilingLight{
    position:absolute;
    left:50%;
    width:100px;
    height:15px;
    transform:translateX(-50%);
    background:#fff8d0;
    box-shadow:0 0 28px #fff1a2,0 0 80px rgba(255,235,140,.25);
}

.cl1{top:12%}
.cl2{top:23%;transform:translateX(-50%) scale(.75)}
.cl3{top:31%;transform:translateX(-50%) scale(.52)}


/* =========================================================
   REAL HALLWAY DOORS
========================================================= */

.hDoor{
    position:absolute;
    cursor:pointer;
    transition:filter .2s,transform .2s;
}

/* door itself */

.hDoorBody{
    position:absolute;
    inset:0;
    border:8px solid #17151a;
    background:
        linear-gradient(
            90deg,
            #3a2c36,
            #634958,
            #352933
        );
    box-shadow:
        inset 0 0 20px rgba(0,0,0,.4),
        0 12px 22px rgba(0,0,0,.4);
}

/* door panels */

.hDoorBody:before{
    content:"";
    position:absolute;
    inset:16px 14px;
    border:3px solid rgba(255,255,255,.12);
    box-shadow:
        inset 0 0 0 3px rgba(0,0,0,.18);
}

/* handle */

.hDoorBody:after{
    content:"";
    position:absolute;
    right:13%;
    top:53%;
    width:11px;
    height:11px;
    border-radius:50%;
    background:#d9bb72;
    box-shadow:0 0 5px #d9bb72;
}

.hDoor:hover{
    filter:brightness(1.3);
}

.hDoorLabel{
    position:absolute;
    left:50%;
    bottom:-30px;
    transform:translateX(-50%);
    color:#ddd;
    font-size:12px;
    white-space:nowrap;
}

/* far doors */

.dFarLeft{
    width:72px;
    height:125px;
    left:25%;
    top:38%;
    transform:perspective(500px) rotateY(16deg);
}

.dFarRight{
    width:72px;
    height:125px;
    right:25%;
    top:38%;
    transform:perspective(500px) rotateY(-16deg);
}

/* middle doors */

.dMidLeft{
    width:105px;
    height:180px;
    left:11%;
    top:32%;
    transform:perspective(500px) rotateY(22deg);
}

.dMidRight{
    width:105px;
    height:180px;
    right:11%;
    top:32%;
    transform:perspective(500px) rotateY(-22deg);
}

/* near doors */

.dNearLeft{
    width:145px;
    height:245px;
    left:-2%;
    top:25%;
    transform:perspective(500px) rotateY(27deg);
}

.dNearRight{
    width:145px;
    height:245px;
    right:-2%;
    top:25%;
    transform:perspective(500px) rotateY(-27deg);
}

/* end */

.hEnd{
    position:absolute;
    left:50%;
    top:37%;
    width:90px;
    height:145px;
    transform:translateX(-50%);
    background:#09080b;
    border:6px solid #242128;
    box-shadow:0 0 50px rgba(0,0,0,.8);
}


/* =========================================================
   4. OCEAN
========================================================= */

#ocean{
    background:
        linear-gradient(
            #8edbff 0%,
            #d9f5ff 43%,
            #0782b3 43%,
            #034866 100%
        );
}

.oceanSun{
    position:absolute;
    top:13%;
    right:15%;
    width:95px;
    height:95px;
    border-radius:50%;
    background:#fff1a5;
    box-shadow:0 0 70px #fff1a5;
}

.wave{
    position:absolute;
    left:-10%;
    width:120%;
    height:90px;
    border-top:4px solid rgba(255,255,255,.55);
    border-radius:50%;
    animation:wave 4s ease-in-out infinite alternate;
}

.wv1{top:52%}
.wv2{top:66%;animation-delay:-1.5s}
.wv3{top:81%;animation-delay:-3s}

@keyframes wave{
    to{transform:translateX(35px)}
}

.oceanIsland{
    position:absolute;
    bottom:34%;
    left:12%;
    width:250px;
    height:80px;
    background:#557a47;
    border-radius:50% 50% 10% 10%;
}


/* =========================================================
   5. FOREST
========================================================= */

#forest{
    background:linear-gradient(
        #83cfee 0%,
        #cdebd0 48%,
        #6b9a57 49%,
        #274c28 100%
    );
}

.tree{
    position:absolute;
    bottom:17%;
    width:0;
    height:0;
    border-left:75px solid transparent;
    border-right:75px solid transparent;
    border-bottom:210px solid #28552c;
}

.tree:after{
    content:"";
    position:absolute;
    left:-10px;
    top:190px;
    width:20px;
    height:75px;
    background:#533925;
}

.fog{
    position:absolute;
    left:-10%;
    width:120%;
    height:130px;
    bottom:25%;
    background:rgba(255,255,255,.18);
    filter:blur(25px);
}


/* =========================================================
   6. SPACE
========================================================= */

#space{
    background:
        radial-gradient(
            circle at 50% 45%,
            #202f6c,
            #090c20 55%,
            #010208
        );
}

.planet{
    position:absolute;
    left:14%;
    top:28%;
    width:190px;
    height:190px;
    border-radius:50%;
    background:linear-gradient(135deg,#d28363,#6e3458);
    box-shadow:0 0 80px rgba(180,100,130,.4);
}

.ring{
    position:absolute;
    width:290px;
    height:70px;
    left:-50px;
    top:60px;
    border:10px solid rgba(218,186,143,.65);
    border-radius:50%;
    transform:rotate(-18deg);
}


/* =========================================================
   7. EMPTY CITY
========================================================= */

#city{
    background:
        linear-gradient(
            #17223a 0%,
            #354c70 58%,
            #101114 59%
        );
}

.cityMoon{
    position:absolute;
    right:15%;
    top:13%;
    width:75px;
    height:75px;
    border-radius:50%;
    background:#e9e5c7;
    box-shadow:0 0 40px rgba(255,240,180,.4);
}

.building{
    position:absolute;
    bottom:0;
    background:#111318;
    border-top:2px solid #20242c;
}

.window{
    position:absolute;
    width:7px;
    height:10px;
    background:#e8d27d;
}


/* =========================================================
   8. RAINY WINDOW
========================================================= */

#rain{
    background:#394653;
}

.windowFrame{
    position:absolute;
    inset:10% 15%;
    background:
        linear-gradient(
            90deg,
            transparent 49%,
            #17191c 49%,
            #17191c 51%,
            transparent 51%
        ),
        linear-gradient(
            transparent 49%,
            #17191c 49%,
            #17191c 51%,
            transparent 51%
        ),
        linear-gradient(#263746,#4f6676);
    border:18px solid #18191c;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.raindrop{
    position:absolute;
    width:3px;
    height:35px;
    background:linear-gradient(transparent,#b9e5ff);
    border-radius:5px;
    animation:rainfall 1s linear infinite;
}

@keyframes rainfall{
    from{transform:translateY(-50px)}
    to{transform:translateY(100vh)}
}


/* =========================================================
   9. WEIRD
========================================================= */

#weird{
    background:
        repeating-conic-gradient(
            from 0deg,
            #ff0055 0deg 20deg,
            #6600ff 20deg 40deg,
            #00d9ff 40deg 60deg
        );
    animation:weird 12s linear infinite;
}

@keyframes weird{
    to{transform:rotate(360deg) scale(1.5)}
}

.weirdText{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:65px;
    font-weight:bold;
    text-shadow:0 5px 20px #000;
}


/* =========================================================
   EVENTS
========================================================= */

#event{
    display:none;
    position:absolute;
    inset:0;
    z-index:1000;
    align-items:center;
    justify-content:center;
    pointer-events:none;
}

#eventText{
    font-size:65px;
    color:white;
    font-weight:bold;
    text-shadow:0 4px 20px #000;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    #startButton{
        width:180px;
        height:180px;
    }

    #message{
        font-size:15px;
    }

    .dNearLeft,
    .dNearRight{
        width:100px;
        height:175px;
    }
}
</style>
</head>


<body>

<!-- =====================================================
     START SCREEN
===================================================== -->

<div id="start">
    <button id="startButton">I'M BORED</button>
</div>


<!-- =====================================================
     WORLD
===================================================== -->

<div id="world">

    <div id="message"></div>


    <!-- LIVING DAY -->

    <div id="sky" class="scene">

        <div class="sun"></div>

        <div class="cloud skyCloud1"></div>
        <div class="cloud skyCloud2"></div>

        <div id="skyFlowers"></div>

        <div class="skyGrass"></div>

    </div>


    <!-- NIGHT -->

    <div id="night" class="scene">

        <div class="moon"></div>

        <div id="nightStars"></div>

    </div>


    <!-- HALLWAY -->

    <div id="hallway" class="scene">

        <div class="hCeiling"></div>

        <div class="hLeft"></div>
        <div class="hRight"></div>

        <div class="hFloor"></div>

        <div class="horizonGlow"></div>

        <div class="ceilingLight cl1"></div>
        <div class="ceilingLight cl2"></div>
        <div class="ceilingLight cl3"></div>

        <div class="hEnd"></div>

        <!-- ACTUAL DOORS -->

        <div class="hDoor dFarLeft" onclick="openDoor('forest')">
            <div class="hDoorBody"></div>
            <div class="hDoorLabel">117</div>
        </div>

        <div class="hDoor dFarRight" onclick="openDoor('space')">
            <div class="hDoorBody"></div>
            <div class="hDoorLabel">∞</div>
        </div>

        <div class="hDoor dMidLeft" onclick="openDoor('rain')">
            <div class="hDoorBody"></div>
            <div class="hDoorLabel">204</div>
        </div>

        <div class="hDoor dMidRight" onclick="openDoor('ocean')">
            <div class="hDoorBody"></div>
            <div class="hDoorLabel">311</div>
        </div>

        <div class="hDoor dNearLeft" onclick="openDoor('city')">
            <div class="hDoorBody"></div>
            <div class="hDoorLabel">000</div>
        </div>

        <div class="hDoor dNearRight" onclick="openDoor('weird')">
            <div class="hDoorBody"></div>
            <div class="hDoorLabel">?</div>
        </div>

    </div>


    <!-- OCEAN -->

    <div id="ocean" class="scene">

        <div class="oceanSun"></div>
        <div class="oceanIsland"></div>

        <div class="wave wv1"></div>
        <div class="wave wv2"></div>
        <div class="wave wv3"></div>

    </div>


    <!-- FOREST -->

    <div id="forest" class="scene">

        <div class="tree" style="left:5%"></div>
        <div class="tree" style="left:21%;transform:scale(.75)"></div>
        <div class="tree" style="left:39%;transform:scale(1.15)"></div>
        <div class="tree" style="left:58%;transform:scale(.8)"></div>
        <div class="tree" style="left:76%;transform:scale(1.25)"></div>
        <div class="tree" style="left:93%;transform:scale(.7)"></div>

        <div class="fog"></div>

    </div>


    <!-- SPACE -->

    <div id="space" class="scene">

        <div class="planet">
            <div class="ring"></div>
        </div>

        <div id="spaceStars"></div>

    </div>


    <!-- CITY -->

    <div id="city" class="scene">

        <div class="cityMoon"></div>
        <div id="buildings"></div>

    </div>


    <!-- RAIN -->

    <div id="rain" class="scene">

        <div class="windowFrame"></div>
        <div id="raindrops"></div>

    </div>


    <!-- WEIRD -->

    <div id="weird" class="scene">

        <div class="weirdText">WHY ARE YOU HERE?</div>

    </div>


    <!-- RANDOM EVENT -->

    <div id="event">
        <div id="eventText"></div>
    </div>


    <div id="counter"></div>

    <button id="again">I'M BORED AGAIN</button>

</div>


<script>

/* =========================================================
   VARIABLES
========================================================= */

const start =
    document.getElementById("start");

const world =
    document.getElementById("world");

const message =
    document.getElementById("message");

const counter =
    document.getElementById("counter");

const scenes =
    document.querySelectorAll(".scene");

let clicks = 0;


/* =========================================================
   START
========================================================= */

document.getElementById("startButton").onclick=()=>{

    start.style.display="none";
    world.style.display="block";

    bored();

};


/* =========================================================
   RANDOMIZER
========================================================= */

document.getElementById("again").onclick=bored;

function bored(){

    clicks++;

    counter.textContent=
        "Clicks: "+clicks;

    scenes.forEach(x=>{
        x.style.display="none";
    });

    /*
       10 DIFFERENT POSSIBILITIES
    */

    const choice=
        Math.floor(Math.random()*10);

    switch(choice){

        case 0:
            day();
            break;

        case 1:
            night();
            break;

        case 2:
            hallway();
            break;

        case 3:
            ocean();
            break;

        case 4:
            forest();
            break;

        case 5:
            space();
            break;

        case 6:
            city();
            break;

        case 7:
            rain();
            break;

        case 8:
            weird();
            break;

        case 9:
            surprise();
            break;

    }

}


/* =========================================================
   DAY
========================================================= */

function day(){

    document.getElementById("sky")
        .style.display="block";

    message.textContent=
        "It's a nice day.";

    createFlowers();

}


/* =========================================================
   NIGHT
========================================================= */

function night(){

    document.getElementById("night")
        .style.display="block";

    message.textContent=
        "You stayed up too late.";

    makeStars(
        document.getElementById("nightStars"),
        120
    );

}


/* =========================================================
   HALLWAY
========================================================= */

function hallway(){

    document.getElementById("hallway")
        .style.display="block";

    message.textContent=
        "There are six doors. Choose carefully.";

}


/* =========================================================
   DOOR DESTINATIONS
========================================================= */

function openDoor(destination){

    scenes.forEach(x=>{
        x.style.display="none";
    });

    if(destination==="forest"){
        forest();
        message.textContent=
            "The door opened into a forest.";
    }

    if(destination==="space"){
        space();
        message.textContent=
            "There should not be space behind that door.";
    }

    if(destination==="rain"){
        rain();
        message.textContent=
            "You hear rain.";
    }

    if(destination==="ocean"){
        ocean();
        message.textContent=
            "The other side is underwater.";
    }

    if(destination==="city"){
        city();
        message.textContent=
            "The city is completely empty.";
    }

    if(destination==="weird"){
        weird();
        message.textContent=
            "You should not have opened that one.";
    }

}


/* =========================================================
   OCEAN
========================================================= */

function ocean(){

    document.getElementById("ocean")
        .style.display="block";

    message.textContent=
        "You found the ocean.";

}


/* =========================================================
   FOREST
========================================================= */

function forest(){

    document.getElementById("forest")
        .style.display="block";

    message.textContent=
        "Something moved between the trees.";

}


/* =========================================================
   SPACE
========================================================= */

function space(){

    document.getElementById("space")
        .style.display="block";

    makeStars(
        document.getElementById("spaceStars"),
        180
    );

    message.textContent=
        "You are floating in space.";

}


/* =========================================================
   CITY
========================================================= */

function city(){

    document.getElementById("city")
        .style.display="block";

    const buildings=
        document.getElementById("buildings");

    buildings.innerHTML="";

    for(let i=0;i<18;i++){

        const b=
            document.createElement("div");

        b.className="building";

        b.style.left=
            (i*6)+"%";

        b.style.width=
            (60+Math.random()*65)+"px";

        b.style.height=
            (150+Math.random()*400)+"px";

        for(let j=0;j<12;j++){

            const w=
                document.createElement("div");

            w.className="window";

            w.style.left=
                (10+Math.random()*75)+"%";

            w.style.top=
                (20+j*28)+"px";

            if(Math.random()<.35)
                w.style.opacity=".15";

            b.appendChild(w);

        }

        buildings.appendChild(b);

    }

    message.textContent=
        "Nobody lives here.";

}


/* =========================================================
   RAIN
========================================================= */

function rain(){

    document.getElementById("rain")
        .style.display="block";

    const drops=

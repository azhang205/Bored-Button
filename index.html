<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometric Clicker</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
    background:
        linear-gradient(135deg, #080b18, #11152b 50%, #080b18);
}

/* ---------- BACKGROUND ---------- */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
}

.bg-shape {
    position: absolute;
    opacity: 0.12;
    animation: float 12s infinite ease-in-out;
}

.bg-circle {
    width: 220px;
    height: 220px;
    border: 35px solid #7c5cff;
    border-radius: 50%;
}

.bg-square {
    width: 180px;
    height: 180px;
    border: 30px solid #00d9ff;
    transform: rotate(45deg);
}

.bg-triangle {
    width: 0;
    height: 0;
    border-left: 110px solid transparent;
    border-right: 110px solid transparent;
    border-bottom: 190px solid #ff4fd8;
}

.bg-shape:nth-child(1) {
    left: 5%;
    top: 10%;
}

.bg-shape:nth-child(2) {
    right: 8%;
    top: 20%;
    animation-delay: 2s;
}

.bg-shape:nth-child(3) {
    left: 35%;
    bottom: -40px;
    animation-delay: 4s;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-40px) rotate(180deg);
    }
}

/* ---------- MAIN ---------- */

.game {
    width: min(1100px, 94vw);
    margin: auto;
    padding-top: 35px;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

h1 {
    font-size: clamp(35px, 6vw, 65px);
    letter-spacing: 4px;
    font-weight: 900;
    background: linear-gradient(
        90deg,
        #00d9ff,
        #7c5cff,
        #ff4fd8
    );
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    color: #9da7c7;
    margin-top: 6px;
}

/* ---------- STATS ---------- */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    backdrop-filter: blur(10px);
}

.stat-label {
    font-size: 12px;
    text-transform: uppercase;
    color: #8e98bb;
}

.stat-value {
    font-size: 25px;
    font-weight: bold;
    margin-top: 5px;
}

/* ---------- LAYOUT ---------- */

.content {
    display: grid;
    grid-template-columns: 1fr 310px;
    gap: 20px;
}

.panel {
    background: rgba(15, 18, 38, 0.78);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 25px;
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

/* ---------- CLICK AREA ---------- */

.click-area {
    min-height: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

.combo {
    height: 30px;
    font-weight: bold;
    color: #00d9ff;
    font-size: 18px;
}

.shape-button {
    width: 270px;
    height: 270px;
    border: none;
    cursor: pointer;
    margin: 25px;
    transition:
        transform 0.08s,
        filter 0.15s;
    background:
        linear-gradient(
            135deg,
            #00d9ff,
            #7c5cff 50%,
            #ff4fd8
        );
    box-shadow:
        0 0 30px rgba(124,92,255,0.4),
        0 0 90px rgba(0,217,255,0.15);
}

.shape-button:hover {
    filter: brightness(1.2);
}

.shape-button:active {
    transform: scale(0.9);
}

/* Shapes */

.circle {
    clip-path: circle(50%);
    border-radius: 50%;
}

.square {
    clip-path: polygon(
        10% 10%,
        90% 10%,
        90% 90%,
        10% 90%
    );
}

.triangle {
    clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
    );
}

.diamond {
    clip-path: polygon(
        50% 0%,
        100% 50%,
        50% 100%,
        0% 50%
    );
}

.hexagon {
    clip-path: polygon(
        25% 6%,
        75% 6%,
        100% 50%,
        75% 94%,
        25% 94%,
        0% 50%
    );
}

.octagon {
    clip-path: polygon(
        30% 0%,
        70% 0%,
        100% 30%,
        100% 70%,
        70% 100%,
        30% 100%,
        0% 70%,
        0% 30%
    );
}

.star {
    clip-path: polygon(
        50% 0%,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 95%,
        50% 72%,
        21% 95%,
        32% 57%,
        2% 35%,
        39% 35%
    );
}

/* ---------- UPGRADES ---------- */

.upgrades {
    padding: 20px;
}

.upgrades h2 {
    margin-bottom: 15px;
}

.upgrade {
    width: 100%;
    padding: 15px;
    margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 15px;
    background: rgba(255,255,255,0.05);
    color: white;
    text-align: left;
    cursor: pointer;
    transition: 0.2s;
}

.upgrade:hover {
    background: rgba(255,255,255,0.1);
    transform: translateY(-2px);
}

.upgrade:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
}

.upgrade-name {
    font-weight: bold;
    font-size: 16px;
}

.upgrade-description {
    font-size: 12px;
    color: #929cbd;
    margin: 5px 0;
}

.upgrade-cost {
    color: #00d9ff;
    font-weight: bold;
}

/* ---------- FLOATING NUMBERS ---------- */

.floating {
    position: absolute;
    pointer-events: none;
    font-size: 22px;
    font-weight: bold;
    animation: rise 0.9s forwards;
    color: #fff;
    text-shadow: 0 0 10px #7c5cff;
}

.critical {
    color: #ff4fd8;
    font-size: 28px;
}

@keyframes rise {
    from {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    to {
        opacity: 0;
        transform: translateY(-100px) scale(1.4);
    }
}

/* ---------- LEVEL ---------- */

.level-bar {
    width: 80%;
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    overflow: hidden;
    margin-top: 15px;
}

.level-progress {
    height: 100%;
    width: 0%;
    background: linear-gradient(
        90deg,
        #00d9ff,
        #7c5cff,
        #ff4fd8
    );
    transition: width 0.3s;
}

/* ---------- RESPONSIVE ---------- */

@media (max-width: 800px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .content {
        grid-template-columns: 1fr;
    }

    .click-area {
        min-height: 430px;
    }

    .shape-button {
        width: 210px;
        height: 210px;
    }

    body {
        overflow-y: auto;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="bg-shape bg-circle"></div>
    <div class="bg-shape bg-square"></div>
    <div class="bg-shape bg-triangle"></div>
</div>

<div class="game">

    <header>
        <h1>GEOMETRIC CLICKER</h1>
        <div class="subtitle">
            Click the geometry. Become the geometry.
        </div>
    </header>

    <div class="stats">

        <div class="stat">
            <div class="stat-label">Points</div>
            <div class="stat-value" id="points">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Per Click</div>
            <div class="stat-value" id="perClick">1</div>
        </div>

        <div class="stat">
            <div class="stat-label">Level</div>
            <div class="stat-value" id="level">1</div>
        </div>

        <div class="stat">
            <div class="stat-label">Best Combo</div>
            <div class="stat-value" id="bestCombo">0</div>
        </div>

    </div>

    <div class="content">

        <div class="panel click-area" id="clickArea">

            <div class="combo" id="combo">
                Combo ×1
            </div>

            <button
                id="shapeButton"
                class="shape-button circle">
            </button>

            <div>
                Click the shape!
            </div>

            <div class="level-bar">
                <div
                    class="level-progress"
                    id="levelProgress">
                </div>
            </div>

        </div>

        <div class="panel upgrades">

            <h2>Upgrades</h2>

            <button class="upgrade" id="powerUpgrade">

                <div class="upgrade-name">
                    Geometric Power
                </div>

                <div class="upgrade-description">
                    +1 point per click
                </div>

                <div class="upgrade-cost">
                    Cost: <span id="powerCost">25</span>
                </div>

            </button>

            <button class="upgrade" id="multiplierUpgrade">

                <div class="upgrade-name">
                    Shape Multiplier
                </div>

                <div class="upgrade-description">
                    Increase your click multiplier
                </div>

                <div class="upgrade-cost">
                    Cost: <span id="multiplierCost">100</span>
                </div>

            </button>

            <button class="upgrade" id="criticalUpgrade">

                <div class="upgrade-name">
                    Critical Geometry
                </div>

                <div class="upgrade-description">
                    Increase critical hit chance
                </div>

                <div class="upgrade-cost">
                    Cost: <span id="criticalCost">250</span>
                </div>

            </button>

        </div>

    </div>

</div>

<script>

let points = 0;
let perClick = 1;

let multiplier = 1;

let level = 1;
let totalClicks = 0;

let combo = 0;
let bestCombo = 0;

let criticalChance = 0.05;

let powerCost = 25;
let multiplierCost = 100;
let criticalCost = 250;

let comboTimer = null;

const pointsDisplay =
    document.getElementById("points");

const perClickDisplay =
    document.getElementById("perClick");

const levelDisplay =
    document.getElementById("level");

const bestComboDisplay =
    document.getElementById("bestCombo");

const comboDisplay =
    document.getElementById("combo");

const shapeButton =
    document.getElementById("shapeButton");

const clickArea =
    document.getElementById("clickArea");

const levelProgress =
    document.getElementById("levelProgress");

const powerUpgrade =
    document.getElementById("powerUpgrade");

const multiplierUpgrade =
    document.getElementById("multiplierUpgrade");

const criticalUpgrade =
    document.getElementById("criticalUpgrade");

const powerCostDisplay =
    document.getElementById("powerCost");

const multiplierCostDisplay =
    document.getElementById("multiplierCost");

const criticalCostDisplay =
    document.getElementById("criticalCost");


/* ---------- SHAPES ---------- */

const shapes = [
    "circle",
    "square",
    "triangle",
    "diamond",
    "hexagon",
    "octagon",
    "star"
];

function changeShape() {

    const current =
        shapeButton.className
            .replace("shape-button ", "");

    let next;

    do {
        next =
            shapes[
                Math.floor(
                    Math.random() * shapes.length
                )
            ];
    } while (next === current);

    shapeButton.className =
        "shape-button " + next;
}


/* ---------- CLICKING ---------- */

shapeButton.addEventListener("click", function(event) {

    totalClicks++;

    combo++;

    if (combo > bestCombo) {
        bestCombo = combo;
    }

    clearTimeout(comboTimer);

    comboTimer = setTimeout(function() {
        combo = 0;
        updateUI();
    }, 1500);

    let gain =
        perClick *
        multiplier *
        Math.max(1, Math.floor(combo / 5) + 1);

    let critical = false;

    if (Math.random() < criticalChance) {
        gain *= 10;
        critical = true;
    }

    points += gain;

    createFloatingNumber(
        event.clientX,
        event.clientY,
        gain,
        critical
    );

    shapeButton.style.transform =
        "scale(0.9) rotate(" +
        (Math.random() * 12 - 6) +
        "deg)";

    setTimeout(function() {
        shapeButton.style.transform = "";
    }, 80);

    changeShape();

    checkLevel();

    updateUI();
});


/* ---------- FLOATING NUMBERS ---------- */

function createFloatingNumber(x, y, amount, critical) {

    const number =
        document.createElement("div");

    number.className =
        "floating" +
        (critical ? " critical" : "");

    number.textContent =
        critical
            ? "CRITICAL +" + amount
            : "+" + amount;

    const rect =
        clickArea.getBoundingClientRect();

    number.style.left =
        (x - rect.left) + "px";

    number.style.top =
        (y - rect.top) + "px";

    clickArea.appendChild(number);

    setTimeout(function() {
        number.remove();
    }, 900);
}


/* ---------- LEVELING ---------- */

function checkLevel() {

    const newLevel =
        Math.floor(
            Math.sqrt(totalClicks / 10)
        ) + 1;

    if (newLevel > level) {
        level = newLevel;

        perClick += level - newLevel + 1;

        changeShape();
    }
}


/* ---------- UPGRADES ---------- */

powerUpgrade.addEventListener("click", function() {

    if (points < powerCost) return;

    points -= powerCost;

    perClick++;

    powerCost =
        Math.floor(powerCost * 1.6);

    updateUI();
});


multiplierUpgrade.addEventListener("click", function() {

    if (points < multiplierCost) return;

    points -= multiplierCost;

    multiplier++;

    multiplierCost =
        Math.floor(multiplierCost * 2.2);

    updateUI();
});


criticalUpgrade.addEventListener("click", function() {

    if (points < criticalCost) return;

    points -= criticalCost;

    criticalChance += 0.03;

    criticalCost =
        Math.floor(criticalCost * 2.5);

    updateUI();
});


/* ---------- UI ---------- */

function updateUI() {

    pointsDisplay.textContent =
        Math.floor(points).toLocaleString();

    perClickDisplay.textContent =
        (perClick * multiplier).toLocaleString();

    levelDisplay.textContent =
        level;

    bestComboDisplay.textContent =
        bestCombo;

    comboDisplay.textContent =
        "Combo ×" +
        Math.max(
            1,
            Math.floor(combo / 5) + 1
        );

    powerCostDisplay.textContent =
        powerCost.toLocaleString();

    multiplierCostDisplay.textContent =
        multiplierCost.toLocaleString();

    criticalCostDisplay.textContent =
        criticalCost.toLocaleString();

    powerUpgrade.disabled =
        points < powerCost;

    multiplierUpgrade.disabled =
        points < multiplierCost;

    criticalUpgrade.disabled =
        points < criticalCost;

    const progress =
        (totalClicks % 10) * 10;

    levelProgress.style.width =
        progress + "%";
}


/* ---------- START ---------- */

updateUI();

</script>

</body>
</html>
